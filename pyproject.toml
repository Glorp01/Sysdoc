[project]
name = "sysdoc"
dynamic = ["version"]
description = "Desktop and CLI assistant for diagnosing game and PC issues"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["diagnostics", "troubleshooting", "cli", "gaming", "network"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer",
    "rich",
    "psutil",
    "google-genai",
]

[project.scripts]
sysdoc = "sysdoc.cli:app"

[project.gui-scripts]
sysdoc-gui = "sysdoc.gui:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "pyinstaller>=6.19,<7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sysdoc*"]

[tool.setuptools.dynamic]
version = {attr = "sysdoc.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
