[project]
name = "sysdoc"
version = "0.1.0"
description = "CLI assistant for diagnosing game and PC issues"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "psutil",
    "anthropic",
]

[project.scripts]
sysdoc = "sysdoc.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
