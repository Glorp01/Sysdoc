name: Windows release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Stamp release version
        id: version
        shell: pwsh
        run: |
          $version = python scripts/stamp_version.py $env:GITHUB_RUN_NUMBER
          if ($LASTEXITCODE -ne 0) { throw "Version stamping failed" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
          python -m pip install -e . --no-deps
      - name: Test
        run: python -m pytest -q
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
      - name: Build desktop app, CLI, and installer
        run: ./scripts/build_windows.ps1
      - name: Test installed app and in-place upgrade
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/smoke_installer.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/release/*
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" --json isDraft --jq .isDraft > draft.txt 2>/dev/null; then
            if [ "$(cat draft.txt)" = "false" ]; then
              echo "Release $tag is already published."
              exit 0
            fi
          else
            cat > notes.md <<'NOTES'
          Download **Sysdoc-Setup-x64.exe** and run it once to install Sysdoc on Windows 10/11 (x64). Python is not required.

          Open **Sysdoc** from the Start menu. Use **Check for updates** to download future versions and update your installation. Sysdoc reopens when the update finishes; your saved API key stays on your PC.

          The installer includes the Sysdoc AI Assistant (`sysdoc.exe`), which diagnoses and fixes PC problems using your own Claude, GPT, or Gemini API key, plus the desktop scanner. The wheel and source archive are for Python users. `SHA256SUMS.txt` lists download checksums.
          NOTES
            gh release create "$tag" --target "$COMMIT_SHA" --draft --title "Sysdoc $tag" --notes-file notes.md --generate-notes
          fi
          gh release upload "$tag" release/* --clobber
          # Only expose the release to updaters after every artifact has been uploaded.
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ -z "$latest" ] || [ "$(printf '%s\n' "$latest" "$tag" | sort -V | tail -n 1)" = "$tag" ]; then
            gh release edit "$tag" --draft=false --latest
          else
            gh release edit "$tag" --draft=false --latest=false
          fi
